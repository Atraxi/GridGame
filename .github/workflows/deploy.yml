name: Deploy to Azure

# Ships the application to an existing web app, and optionally the Cloudflare proxy in front of it.
#
# Infrastructure is provisioned by hand in the portal (see DEPLOYMENT.md); this workflow never creates or changes an
# Azure resource, it only deploys code to the web app named by the AZURE_WEBAPP_NAME repository variable.
#
# Authentication uses GitHub OIDC - there is no publish profile or client secret stored anywhere.

on:
  push:
    branches: [claudes-version]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch:

# Only one deployment at a time; a queued run supersedes an older queued one.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  # Required for azure/login to exchange the GitHub OIDC token for an Azure access token.
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'
  API_PROJECT: GridGame.Server/GridGameAPI/GridGameAPI.csproj

jobs:
  build:
    name: Build client and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: GridGame.Client/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # vite.config.ts writes the bundle straight into the API's wwwroot, so the publish step below
      # picks it up and the SPA ends up served from the same origin as the API and the SignalR hub.
      - name: Build client
        working-directory: GridGame.Client
        run: |
          npm ci
          npm run build

      - name: Publish API
        run: dotnet publish "$API_PROJECT" --configuration Release --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish
          retention-days: 3

  deploy:
    name: Deploy application
    runs-on: ubuntu-latest
    needs: build
    outputs:
      hostName: ${{ steps.site.outputs.hostName }}
    environment:
      name: production
      url: https://${{ steps.site.outputs.hostName }}
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      WEB_APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: publish

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Asked of Azure rather than assumed: a web app created in the portal with "unique default hostname" on gets
      # <name>-<hash>.<region>-01.azurewebsites.net, not <name>.azurewebsites.net.
      - name: Look up the web app
        id: site
        run: |
          set -euo pipefail
          if [ -z "$WEB_APP_NAME" ]; then
            echo "::error::Set the AZURE_WEBAPP_NAME repository variable."
            exit 1
          fi
          host=$(az webapp show --resource-group "$RESOURCE_GROUP" --name "$WEB_APP_NAME" \
            --query defaultHostName --output tsv)
          echo "hostName=$host" >> "$GITHUB_OUTPUT"

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEB_APP_NAME }}
          package: publish

      - name: Summarise
        run: echo "Deployed to https://${{ steps.site.outputs.hostName }}" >> "$GITHUB_STEP_SUMMARY"

  # Optional: the Cloudflare Worker that fronts the web app with a custom domain, which the free App Service plan
  # can't bind itself. Skipped until the CLOUDFLARE_ACCOUNT_ID repository variable exists. The Cloudflare side
  # (API token, attaching the domain to the Worker) is set up by hand - see DEPLOYMENT.md, "Custom domains".
  proxy:
    name: Deploy Cloudflare proxy
    runs-on: ubuntu-latest
    needs: deploy
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    steps:
      - uses: actions/checkout@v4

      # ORIGIN_HOST is the hostname Azure itself reported in the deploy job, so the two can't drift.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.146.0'
          workingDirectory: cloudflare/proxy
          command: deploy --var ORIGIN_HOST:${{ needs.deploy.outputs.hostName }}
